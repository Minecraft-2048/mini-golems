// Copper Golem — NeoForge 1.20.1.
//
// Retroportage du golem de cuivre de la mise a jour Copper Age (1.21.9) vers 1.20.1, ou ni le
// golem ni le coffre de cuivre n'existent. La construction, l'oxydation, le cirage, la statue et
// le tri d'objets suivent le comportement vanilla ; le coffre de cuivre est ajoute parce que le
// tri n'a pas de sens sans lui.
//
// Sur 1.20.1 NeoForge est publie sous net.neoforged:forge et conserve les paquets
// net.minecraftforge : le build est un ForgeGradle classique pointe sur le depot NeoForged.
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "2023.09.03-1.20.1"

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    minecraft "net.neoforged:forge:${project.minecraft_version}-${project.neoforge_version}"
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
        ])
    }
}
